---
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "examples/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install yamllint && python -m yamllint --strict .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Version
        run: |
          $m = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.\d+"').Matches[0]
          $v = "$($m.Groups[1]).$($m.Groups[2]).${{ github.run_number }}"
          "VERSION=$v" >> $env:GITHUB_ENV
          "TILE_VERSION=$v" >> $env:GITHUB_ENV
      - run: cargo build --release -p tile
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer/tile.iss
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:VERSION target/release/Tile.exe target/installer/Tile-Setup-$env:VERSION.exe
          --target ${{ github.sha }} --title $env:VERSION --generate-notes
