[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` starts the daemon; pass `--workspace` to build or test everything.
default-members = ["crates/tile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mbwilding/tile"

# `tile-hook` is the one crate that opts out of these (it holds all the `unsafe`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Latest releases, default features off; crates opt into exactly what they use
# (tokio features are chosen per crate).
[workspace.dependencies]
tile-core = { path = "crates/tile-core" }
tile-hook = { path = "crates/tile-hook" }
tile-config = { path = "crates/tile-config" }
tile-ipc = { path = "crates/tile-ipc" }
tile-launcher = { path = "crates/tile-launcher" }
tile-platform = { path = "crates/tile-platform" }
tile-remap = { path = "crates/tile-remap" }

anyhow = "1.0"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dirs = "7.0"
interprocess = { version = "2.4", default-features = false, features = ["tokio"] }
notify = { version = "8.2", default-features = false }
regex = "1.13"
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tokio = { version = "1.54", default-features = false }
serde_yaml_ng = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
widestring = { version = "1.2", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
tray-icon = { version = "0.26", default-features = false }
uiautomation = "0.25"
win-hotkeys = { version = "0.5", default-features = false }
wineventhook = { version = "0.11", default-features = false }
# Pinned to the version winvd uses, only for its `HWND` type (constructing it is safe).
windows = { version = "0.58", default-features = false, features = ["Win32_Foundation"] }
winsafe = { version = "0.0.29", default-features = false, features = ["user", "dwm", "kernel", "gdi", "gui", "ole", "shell", "advapi"] }
windows-sys = { version = "0.61", default-features = false }
winvd = { version = "0.0.49", default-features = false }

# Our crates build unoptimized for fast iteration; dependencies are optimized once and cached.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
