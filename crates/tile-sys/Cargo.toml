[package]
name = "tile-sys"
description = "Audio, power, network and radios, the single-instance mutex, the console and window messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM and WinRT interfaces behind volume, network, Wi-Fi and Bluetooth.
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

# Not the workspace lints: this crate is where `unsafe` is allowed. Every block says why it
# is sound in a `// SAFETY:` comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
