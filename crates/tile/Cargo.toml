[package]
name = "tile"
description = "A dynamic tiling window manager and key remapper for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "Tile"
path = "src/main.rs"

[dependencies]
tile-config.workspace = true
tile-core.workspace = true
tile-input.workspace = true
tile-ipc.workspace = true
tile-launcher.workspace = true
tile-platform.workspace = true
tile-remap.workspace = true
tile-shell.workspace = true
tile-sys.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "signal", "io-util"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Task Scheduler, for `install`, on top of the workspace features.
winsafe = { workspace = true, features = ["taskschd"] }

[build-dependencies]
embed-manifest = { version = "1.5", default-features = false }

[lints]
workspace = true
