[package]
name = "tile"
description = "A dynamic tiling window manager and keyd-style key remapper for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Tile"
path = "src/main.rs"

[dependencies]
tile-config.workspace = true
tile-core.workspace = true
tile-input.workspace = true
tile-ipc.workspace = true
tile-launcher.workspace = true
tile-platform.workspace = true
tile-remap.workspace = true
tile-shell.workspace = true
tile-sys.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "signal", "io-util"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
interprocess.workspace = true
# Registry, UAC and Task Scheduler, for `install` (the workspace entry enables much more).
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "shell", "taskschd"] }

[build-dependencies]
embed-manifest = { version = "1.5", default-features = false }

[lints]
workspace = true
